<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MySTRA - Location Registry</title>
    <link rel="stylesheet" href="control-panel.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="document.js" defer></script>
    <script src="control-panel.js"></script>

    <style>
        .map-visual { background:#F1F5F9;border-radius:12px;padding:20px;text-align:center;min-height:200px;display:flex;flex-direction:column;justify-content:center;align-items:center; }
        .geofence-container { position:relative;width:180px;height:180px;margin:0 auto; }
        .geofence-container .outer-circle { position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:120px;height:120px;border-radius:50%;border:2px dashed #2563EB;opacity:0.3; }
        .geofence-container .inner-circle { position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:60px;height:60px;border-radius:50%;background:#2563EB;opacity:0.15;border:2px solid #2563EB; }
        .geofence-container .property-marker { position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#2563EB;width:16px;height:16px;border-radius:50%;z-index:2; }
        .geofence-container .user-marker { position:absolute;top:30%;left:70%;background:#22C55E;width:12px;height:12px;border-radius:50%;border:2px solid white;box-shadow:0 0 0 4px rgba(34,197,94,0.3);z-index:3; }
        .geofence-container .user-marker.outside { background:#EF4444;box-shadow:0 0 0 4px rgba(239,68,68,0.3); }
        .badge-pending { background:#FEF3C7;color:#92400E;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600; }
        .badge-approved { background:#DCFCE7;color:#15803D;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600; }
        .badge-rejected { background:#FEE2E2;color:#991B1B;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600; }
    </style>
</head>
<body>
    <div class="portal-container">
        <nav class="sidebar">
            <div class="sidebar-brand">MySTRA Portal</div>
            <ul class="nav-links">
                <li class="nav-item" onclick="window.location.href='mystra-code-control.html';"><span class="icon">🏠</span> Home</li>
                <li class="nav-item" onclick="window.location.href='mystra-code-control.html';"><span class="icon">🔑</span> MySTRA Code Manager</li>
                <li class="nav-item active-nav" onclick="window.location.href='mystra-document-portal.html';"><span class="icon">📄</span> Documents</li>
                <li class="nav-item" onclick="window.location.href='mystra-settings.html';"><span class="icon">⚙️</span> Settings</li>
                <li id="nav-logout" class="nav-item" style="margin-top: 24px; color: #EF4444; cursor: pointer; border-top: 1px solid #E5E7EB; padding-top: 16px;">
                    <span class="icon">🚪</span> Logout
                </li>
            </ul>
            <div class="sidebar-footer" style="margin-top:auto;padding-top:20px;border-top:1px solid #E5E7EB;">
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
                    <div id="footer-avatar" style="width:32px;height:32px;border-radius:50%;background:#2563EB;color:white;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;">--</div>
                    <div style="flex:1;min-width:0;">
                        <div id="sidebar-username" style="font-size:13px;font-weight:600;color:#111827;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Loading...</div>
                        <div id="sidebar-userbusiness" style="font-size:11px;color:#6B7280;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Loading...</div>
                    </div>
                </div>
                <div id="sidebar-userstatus" style="font-size:11px;font-weight:600;padding:3px 8px;border-radius:12px;display:inline-block;background:#FEF3C7;color:#92400E;">⏳ Loading...</div>
            </div>
        </nav>

        <main class="main-content">
            <header class="content-header">
                <div class="header-title-wrapper">
                    <h1>📍 Location Registry</h1>
                    <span id="db-status-badge" class="status-badge">🟢 SUPABASE LIVE</span>
                </div>
                <div style="font-size:13px;color:#6B7280;">Home / Documents / Location</div>
            </header>

            <div class="segmented-control">
                <button class="tab-btn" onclick="window.location.href='mystra-document-portal.html'">📤 Upload</button>
                <button class="tab-btn" onclick="window.location.href='mystra-mydocuments.html'">📋 My Documents</button>
                <button class="tab-btn active">📍 Location</button>
            </div>

            <div id="location-registry-container">
                <p style="color:#6B7280;text-align:center;padding:20px;">Loading location data...</p>
            </div>
        </main>
    </div>
</body>
</html>
