<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>mock-legacy-system | Registration Portal & ETL Engine</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 30px; }
    .container { max-width: 960px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .card { background: #1e293b; padding: 24px; border-radius: 12px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    h2 { margin-top: 0; color: #38bdf8; font-size: 20px; border-bottom: 1px solid #334155; padding-bottom: 12px; }
    label { font-size: 11px; font-weight: 600; color: #94a3b8; display: block; margin-top: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    input { width: 100%; padding: 8px 10px; margin-top: 2px; box-sizing: border-box; background: #0f172a; color: #f8fafc; border: 1px solid #475569; border-radius: 6px; font-size: 13px; }
    input:focus { outline: none; border-color: #38bdf8; }
    button { width: 100%; padding: 12px; margin-top: 16px; border: none; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; transition: all 0.2s; }
    .btn-submit { background: #2563eb; color: white; }
    .btn-submit:hover { background: #1d4ed8; }
    .btn-etl { background: #10b981; color: white; }
    .btn-etl:hover { background: #059669; }
    #log { background: #020617; color: #38bdf8; font-family: "Fira Code", monospace; font-size: 12px; padding: 14px; border-radius: 6px; border: 1px solid #1e293b; height: 400px; overflow-y: auto; white-space: pre-wrap; margin-top: 8px; }
  </style>
</head>
<body>

<div class="container">
  <!-- Card 1: Legacy Registration Form -->
  <div class="card">
    <h2>🏛️ mock-legacy-system</h2>
    <p style="font-size: 12px; color: #94a3b8; margin-bottom: 12px;">Saves raw legacy entries directly into <code>mock_legacy_external_db</code>.</p>
    
    <form id="regForm">
      <label>Operator Full Name</label>
      <input type="text" id="opName" placeholder="e.g. Ahmad Razali" required />

      <label>Business Name</label>
      <input type="text" id="bizName" placeholder="e.g. Langkawi Ocean Resort" required />

      <label>Operator Email (Unique Key)</label>
      <input type="email" id="email" placeholder="e.g. ahmad@langkawiocean.com" required />

      <label>License Code (Unique Key)</label>
      <input type="text" id="license" placeholder="e.g. LIC-LGK-9922" required />

      <label>SSM Registration Number (Unique Key)</label>
      <input type="text" id="ssm" placeholder="e.g. SSM-2026-882211" required />

      <label>Phone Number</label>
      <input type="text" id="phone" placeholder="e.g. +60123456789" required />

      <label>State</label>
      <input type="text" id="state" placeholder="e.g. Kedah" required />

      <label>District</label>
      <input type="text" id="district" placeholder="e.g. Langkawi" required />

      <button type="submit" class="btn-submit">Register Account</button>
    </form>
  </div>

  <!-- Card 2: ETL Control Panel -->
  <div class="card">
    <h2>⚡ ETL Ingestion Control</h2>
    <p style="font-size: 12px; color: #94a3b8; margin-bottom: 12px;">Extracts active records and populates <code>legacy_accounts</code>, <code>profiles</code>, and <code>compliance_documents</code>.</p>
    
    <button id="runEtlBtn" class="btn-etl">🚀 Trigger Migration Ingestion</button>
    
    <label style="margin-top: 14px;">Live Engine Execution Console:</label>
    <div id="log">System initialized. Ready for operations...</div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://lpovahpueihltaclwzzy.supabase.co";
  const SUPABASE_SERVICE_ROLE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxwb3ZhaHB1ZWlobHRhY2x3enp5Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NjkwMjQ2OCwiZXhwIjoyMTAyNDc4NDY4fQ.PdiFWArBh5WM6S7RlPm13xnPYo2ux524U0gYSHt6keg";

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY);
  const logDiv = document.getElementById('log');

  function log(msg) {
    logDiv.innerText += "\n" + msg;
    logDiv.scrollTop = logDiv.scrollHeight;
  }

  function generateUUID() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
      const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
      return v.toString(16);
    });
  }

  // 1. Submit registration form
  document.getElementById('regForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    log("📝 Transmitting record to mock_legacy_external_db...");

    const payload = {
      operator_name: document.getElementById('opName').value,
      operator_business_name: document.getElementById('bizName').value,
      operator_email: document.getElementById('email').value,
      licence_no_code: document.getElementById('license').value,
      ssm_reg_number: document.getElementById('ssm').value,
      phone_number: document.getElementById('phone').value,
      legacy_state: document.getElementById('state').value,
      legacy_district: document.getElementById('district').value,
      system_status: 'ACTIVE',
      created_at: new Date().toISOString()
    };

    const { data, error } = await supabaseClient.from('mock_legacy_external_db').insert([payload]).select();

    if (error) {
      log("❌ Insert Error: " + error.message);
    } else {
      log(`✅ DB ACKNOWLEDGED INSERT! raw_id: ${data[0].raw_id} | Email: "${data[0].operator_email}"`);
      
      document.getElementById('opName').value = '';
      document.getElementById('bizName').value = '';
      document.getElementById('email').value = '';
      document.getElementById('license').value = '';
      document.getElementById('ssm').value = '';
      document.getElementById('phone').value = '';
      document.getElementById('state').value = '';
      document.getElementById('district').value = '';
    }
  });

  // 2. Execute browser ETL pipeline across profiles and compliance_documents
  document.getElementById('runEtlBtn').addEventListener('click', async () => {
    log("\n⚡ Starting Multi-Table Ingestion Engine...");

    const { data: allRows, error: extractErr } = await supabaseClient.from('mock_legacy_external_db').select('*');
    if (extractErr) return log("❌ Extraction Error: " + extractErr.message);

    const activeRows = (allRows || []).filter(r => r.system_status && r.system_status.trim().toUpperCase() === 'ACTIVE');
    log(`📦 Extracted ${activeRows.length} active records from legacy DB.`);

    for (const raw of activeRows) {
      const email = (raw.operator_email || raw.old_operator_email || '').trim().toLowerCase();
      const license = (raw.licence_no_code || '').trim().toUpperCase();
      const ssm = (raw.ssm_reg_number || '').trim().toUpperCase();
      const opName = (raw.operator_name || raw.old_operator_name || 'Legacy Operator').trim();
      const bizName = (raw.operator_business_name || opName).trim();
      const phone = (raw.phone_number || '+60000000000').trim();
      const state = (raw.legacy_state || '').trim();
      const district = (raw.legacy_district || '').trim();

      if (!email || !license || !ssm) continue;

      // A) Save legacy_accounts
      const { error: legacyErr } = await supabaseClient.from('legacy_accounts').upsert({
        legacy_email: email, 
        license_no: license, 
        business_ssm: ssm, 
        is_migrated: false
      }, { onConflict: 'legacy_email' });

      if (!legacyErr) log(`✅ [legacy_accounts] Saved ${email}`);

      // B) Save profiles
      const profilePayload = {
        id: generateUUID(),
        full_name: opName,
        phone_no: phone,
        business_name: bizName,
        business_ssm: ssm,
        is_verified: true,
        role: 'operator'
      };

      const { error: profileErr } = await supabaseClient.from('profiles').upsert(profilePayload, { onConflict: 'business_ssm' });
      if (!profileErr) log(`👤 [profiles] Saved Name: "${opName}" | Biz: "${bizName}"`);

      // C) Save compliance_documents
      const compliancePayload = {
        document_type: 'SSM Certificate',
        review_status: 'Pending',
        status: 'PENDING',
        ssm_number: ssm,
        operator_name: opName,
        state: state,
        district: district,
        uploaded_at: new Date().toISOString()
      };

      const { error: complianceErr } = await supabaseClient.from('compliance_documents').insert([compliancePayload]);
      if (!complianceErr) log(`📄 [compliance_documents] Saved Doc for SSM ${ssm}`);
    }
    log("🎉 [ETL Pipeline Completed Successfully]");
  });
</script>

</body>
</html>
