<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MySTRA - Generate Reports</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="gov-admin-styles.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
</head>
<body>

    <div class="portal-layout">
        <!-- SIDEBAR NAVIGATION -->
        <aside class="sidebar" id="app-sidebar">
            <div class="sidebar-brand">
                <span class="brand-icon">🏛️</span>
                <span class="brand-name">MySTRA Admin</span>
            </div>

            <ul class="nav-menu">
                <a href="gov-admin-dashboard.html" class="nav-link">
                    <li class="nav-item">
                        <span class="nav-icon">📊</span>
                        <span class="nav-label">Dashboard</span>
                    </li>
                </a>
                <a href="gov-admin-workspace.html" class="nav-link">
                    <li class="nav-item">
                        <span class="nav-icon">📄</span>
                        <span class="nav-label">Documents</span>
                    </li>
                </a>
                <a href="gov-admin-reports.html" class="nav-link">
                    <li class="nav-item active">
                        <span class="nav-icon">📈</span>
                        <span class="nav-label">Generate Reports</span>
                    </li>
                </a>
                <a href="gov-admin-verified.html" class="nav-link">
                    <li class="nav-item">
                        <span class="nav-icon">🏢</span>
                        <span class="nav-label">Verified Operators</span>
                    </li>
                </a>
                <a href="gov-admin-audit.html" class="nav-link">
                    <li class="nav-item">
                        <span class="nav-icon">📋</span>
                        <span class="nav-label">Audit Log</span>
                    </li>
                </a>
                <a href="#" class="nav-link" onclick="alert('Settings panel active.')">
                    <li class="nav-item">
                        <span class="nav-icon">⚙️</span>
                        <span class="nav-label">Settings</span>
                    </li>
                </a>
            </ul>
        </aside>

        <!-- MAIN WORKSPACE -->
        <main class="main-workspace">
            <header class="top-bar">
                <button id="btn-toggle-sidebar" class="btn-sidebar-toggle">☰ Menu</button>
                <div class="officer-badge">
                    🟢 Officer Session: <strong>ACTIVE [ADM-MYSTRA-2026]</strong>
                </div>
            </header>

            <div class="gov-workspace-container">
                <div class="gov-header">
                    <div>
                        <h1 class="gov-title">Executive Compliance Reports</h1>
                        <p class="gov-subtitle">Export official regulatory metrics and state density summaries.</p>
                    </div>
                </div>

                <div class="gov-card" style="max-width: 600px;">
                    <h3>Report Generator Options</h3>
                    <div style="margin-top: 15px;">
                        <label style="font-size: 13px; font-weight: 600;">Report Type:</label>
                        <select id="report-type" class="gov-dropdown" style="width: 100%; margin-top: 6px;">
                            <option value="COMPLIANCE_SUMMARY">Nationwide Compliance Summary (PDF)</option>
                            <option value="OPERATOR_DIRECTORY">Verified Operator Registry (CSV)</option>
                            <option value="AUDIT_TRAIL">Officer Decision Log (CSV)</option>
                        </select>
                    </div>

                    <div style="margin-top: 15px;">
                        <label style="font-size: 13px; font-weight: 600;">Target Region:</label>
                        <select id="report-region" class="gov-dropdown" style="width: 100%; margin-top: 6px;">
                            <option value="ALL">All Malaysia States</option>
                            <option value="Penang">Penang</option>
                            <option value="Selangor">Selangor</option>
                            <option value="Sabah">Sabah</option>
                        </select>
                    </div>

                    <button class="gov-btn btn-primary" style="margin-top: 20px; width: 100%;" onclick="alert('Generating report...')">📥 Download Report</button>
                </div>
            </div>
        </main>
    </div>

</body>
</html>
